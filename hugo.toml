baseURL      = "https://hellokar.org/"
title        = "Kar's Blog"
theme        = "hugo-bearblog-master"
languageCode = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true
hasCJKLanguage = true
enableGitInfo = true

[frontmatter]
  lastmod = [":git", "lastmod", "date", "publishDate"]

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


[permalinks]
  blog = "/blog/:contentbasename/"

[sitemap]
  changeFreq = "weekly"
  priority = 0.5

[menu]
  [[menu.main]]
    name = "Latest"
    pageRef = "/latest"
    weight = 1
  [[menu.main]]
    name = "Parade"
    pageRef = "/parade"
    weight = 2
  [[menu.main]]
    name = "Bird"
    pageRef = "/bird"
    weight = 3
  [[menu.main]]
    name = "Flux"
    pageRef = "/flux"
    weight = 4

[params]
  description = "A Nothing Big Blog"
  author = "Kar Chan"
  authorJobTitle = "产品学徒"
  authorBio = "INTJ 产品学徒 。博客「Kar's Blog」的仓库创建者以及日常打扫清理。业余走走逛逛文字，正在学习做一个合格的父亲。"
  authorAvatar = "apple-touch-icon.png"
  authorSameAs = [
    "https://github.com/thekarchan",
    "https://x.com/kar_found",
    "https://c7.io/@kar",
    "https://broadcast-17n.pages.dev"
  ]
  defaultImage = "apple-touch-icon.png"
  favicon = "favicon.svg"
  customCSS = ["custom.css"]
  mainSections = ["blog"] 
  listSummaries = true

[services]
  [services.googleAnalytics]
    ID = "G-09506ENLJ2"

[outputFormats.RSS]
  baseName = "rss"