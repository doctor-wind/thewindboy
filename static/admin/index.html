<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Decap CMS</title>
    <link rel="stylesheet" href="custom.css?v=20260306-7" />
  </head>
  <body>
    <script>
      (() => {
        const SORT_LABELS = ['排序', 'Sort by', 'Sort'];
        const SORT_STORAGE_KEY = 'decap-cms.entries.sort';
        const VIEW_STYLE_KEY = 'decap-cms.entries.viewStyle';
        const VIEW_STYLE_LIST = 'VIEW_STYLE_LIST';
        const ENTRY_PAGE_SIZE = 12;
        const PAGER_ID = 'decap-local-pager';
        let currentEntryPage = 1;

        const onPostsCollectionPage = () => /#\/collections\/posts/.test(window.location.hash);

        const getEntryList = () => {
          const lists = Array.from(document.querySelectorAll('ul'));
          return lists.find(list => list.querySelector('a[href*="/collections/posts/entries/"]'));
        };

        const getEntryRows = list => {
          return Array.from(list.children).filter(item => {
            return !!item.querySelector('a[href*="/collections/posts/entries/"]');
          });
        };

        const removePager = () => {
          const pager = document.getElementById(PAGER_ID);
          if (pager) pager.remove();
        };

        const renderEntryPager = (list, totalPages) => {
          let pager = document.getElementById(PAGER_ID);

          if (!pager) {
            pager = document.createElement('div');
            pager.id = PAGER_ID;
            pager.className = 'decap-local-pager';
            pager.innerHTML = [
              '<button type="button" data-role="prev">上一页</button>',
              '<span data-role="info"></span>',
              '<button type="button" data-role="next">下一页</button>',
            ].join('');

            list.insertAdjacentElement('afterend', pager);

            pager.querySelector('[data-role="prev"]').addEventListener('click', () => {
              if (currentEntryPage <= 1) return;
              currentEntryPage -= 1;
              paginateEntries();
            });

            pager.querySelector('[data-role="next"]').addEventListener('click', () => {
              if (currentEntryPage >= totalPages) return;
              currentEntryPage += 1;
              paginateEntries();
            });
          }

          const prev = pager.querySelector('[data-role="prev"]');
          const next = pager.querySelector('[data-role="next"]');
          const info = pager.querySelector('[data-role="info"]');

          info.textContent = `第 ${currentEntryPage} / ${totalPages} 页`;
          prev.disabled = currentEntryPage <= 1;
          next.disabled = currentEntryPage >= totalPages;
        };

        const paginateEntries = () => {
          if (!onPostsCollectionPage()) {
            removePager();
            return;
          }

          const list = getEntryList();
          if (!list) {
            removePager();
            return;
          }

          const rows = getEntryRows(list);
          const totalPages = Math.max(1, Math.ceil(rows.length / ENTRY_PAGE_SIZE));

          if (currentEntryPage > totalPages) currentEntryPage = totalPages;
          if (currentEntryPage < 1) currentEntryPage = 1;

          rows.forEach((row, index) => {
            const page = Math.floor(index / ENTRY_PAGE_SIZE) + 1;
            row.style.display = page === currentEntryPage ? '' : 'none';
          });

          if (totalPages <= 1) {
            removePager();
            return;
          }

          renderEntryPager(list, totalPages);
        };

        const enforceCollectionDefaults = () => {
          const raw = localStorage.getItem(SORT_STORAGE_KEY);
          let current = {};

          try {
            current = raw ? JSON.parse(raw) : {};
          } catch {
            current = {};
          }

          current.posts = {
            commit_date: {
              key: 'commit_date',
              direction: 'Descending',
              index: 0,
            },
          };

          localStorage.setItem(SORT_STORAGE_KEY, JSON.stringify(current));
          localStorage.setItem(VIEW_STYLE_KEY, VIEW_STYLE_LIST);
        };

        const hideSortControl = () => {
          const controls = document.querySelectorAll('button, [role="button"]');
          controls.forEach(control => {
            const text = (control.textContent || '').trim();
            const ariaLabel = (control.getAttribute('aria-label') || '').toLowerCase();
            const isSortButton =
              SORT_LABELS.includes(text) || ariaLabel.includes('sort') || ariaLabel.includes('排序');
            if (!isSortButton) return;

            const wrapper = control.closest('div');
            if (!wrapper) return;
            wrapper.style.display = 'none';
          });
        };

        const hideViewStyleControls = () => {
          const controls = document.querySelectorAll('button[aria-label]');
          const markers = ['list', 'grid', '列表', '网格'];

          controls.forEach(control => {
            const ariaLabel = (control.getAttribute('aria-label') || '').toLowerCase();
            if (!markers.some(marker => ariaLabel.includes(marker))) return;

            control.style.display = 'none';
            const parent = control.parentElement;
            if (parent && parent.querySelectorAll('button').length <= 2) {
              parent.style.display = 'none';
            }
          });
        };

        const tidyHeader = () => {
          const header = document.querySelector('header');
          if (!header) return;

          header.querySelectorAll('nav li svg').forEach(icon => icon.remove());

          header.querySelectorAll('a[href]').forEach(link => {
            const text = (link.textContent || '').trim();
            const href = (link.getAttribute('href') || '').trim();
            if (/github\.io|workers\.dev/i.test(text) || /github\.io|workers\.dev/i.test(href)) {
              link.style.display = 'none';
            }
          });

          header.querySelectorAll('button').forEach(button => {
            const text = (button.textContent || '').trim();
            const isAvatarLike = !text && !!button.querySelector('img,svg');
            if (isAvatarLike) button.style.display = 'none';
          });
        };

        const improvePrimaryButtonContrast = () => {
          const buttons = document.querySelectorAll('button, [role="button"], a');
          buttons.forEach(button => {
            const text = (button.textContent || '').replace(/\s+/g, '');
            if (!text.includes('新建文章')) return;

            button.style.background = '#0f766e';
            button.style.borderColor = '#0f766e';
            button.style.color = '#ffffff';
            button.style.fontWeight = '600';
          });
        };

        const applyUiTweaks = () => {
          enforceCollectionDefaults();
          hideSortControl();
          hideViewStyleControls();
          tidyHeader();
          improvePrimaryButtonContrast();
          paginateEntries();
        };

        const observer = new MutationObserver(applyUiTweaks);
        observer.observe(document.documentElement, { childList: true, subtree: true });

        window.addEventListener('hashchange', () => {
          currentEntryPage = 1;
          applyUiTweaks();
        });

        window.addEventListener('load', applyUiTweaks);
        applyUiTweaks();
      })();
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
