<div id="ptr-container">
  <span class="ptr-icon">🎐</span>
  <span class="ptr-text">下拉刷新...</span>
</div>

<audio id="ptr-audio" src="data:audio/mp3;base64,//NExAAAAANIAUAAABVAB1JgGgAAwABQv/3yEAgA/5f/8/8wIeAAAAAHjQGDAAAAAD//NExIAAAANIAUAAABVAB1JgGgAAwABQv/3yEAgA/5f/8/8wIeAAAAAHjQGDAAAAAD" preload="auto"></audio>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const body = document.body;
  const ptrContainer = document.getElementById("ptr-container");
  const ptrText = ptrContainer.querySelector(".ptr-text");
  const ptrIcon = ptrContainer.querySelector(".ptr-icon");
  const ptrAudio = document.getElementById("ptr-audio");
  
  let startY = 0;
  let isPulling = false;
  const threshold = 60;

  // Touch start
  window.addEventListener('touchstart', (e) => {
    if (window.scrollY <= 0) {
      startY = e.touches[0].clientY;
      isPulling = true;
      body.style.transition = 'none';
    }
  }, { passive: true });

  // Touch move
  window.addEventListener('touchmove', (e) => {
    if (!isPulling) return;
    
    const y = e.touches[0].clientY;
    const dy = y - startY;

    if (dy > 0 && window.scrollY <= 0) {
      // Add friction
      let pullDistance = dy / 2.5;
      if (pullDistance > 100) pullDistance = 100 + (pullDistance - 100) * 0.2; // strong resistance after 100px

      body.style.transform = `translateY(${pullDistance}px)`;
      
      if (pullDistance > threshold) {
        ptrText.innerText = "松开刷新...";
      } else {
        ptrText.innerText = "下拉刷新...";
      }
      
      if (e.cancelable) e.preventDefault(); 
    }
  }, { passive: false });

  // Touch end
  window.addEventListener('touchend', (e) => {
    if (!isPulling) return;
    isPulling = false;
    
    body.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    
    const match = body.style.transform.match(/translateY\((.*)px\)/);
    const finalY = match ? parseFloat(match[1]) : 0;

    if (finalY > threshold) {
      // Trigger refresh
      body.style.transform = `translateY(${threshold}px)`;
      ptrText.innerText = "正在刷新...";
      ptrIcon.classList.add("swinging");
      
      if (ptrAudio) {
         ptrAudio.volume = 0.5;
         ptrAudio.play().catch(()=>{});
      }
      
      setTimeout(() => {
        window.location.reload();
      }, 600);
    } else {
      // Snap back
      body.style.transform = `translateY(0)`;
    }
  });
});
</script>
