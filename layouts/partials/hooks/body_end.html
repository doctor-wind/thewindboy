{{ if .IsHome }}
<div id="firecracker-widget" class="firecracker-widget" aria-label="鞭炮互动效果">
  <button id="firecracker-fuse" class="fire-fuse" type="button" aria-label="点燃鞭炮"></button>
  <div class="fire-rope" aria-hidden="true"></div>
  <div id="firecracker-chain" class="fire-cracker-chain" aria-hidden="true">
    {{ range seq 1 20 }}
    <span class="fire-cracker" style="--idx: {{ . }}"></span>
    {{ end }}
  </div>
  <div id="fire-smoke-layer" class="fire-smoke-layer" aria-hidden="true"></div>
  <div id="fire-paper-layer" class="fire-paper-layer" aria-hidden="true"></div>
</div>
<script defer src="{{ "js/firecracker-widget.js" | relURL }}"></script>
{{ end }}
