<footer style="padding-top: 1rem;">
  <hr>
  
  <style>
    .my-custom-icons svg, .my-custom-icons img {
      height: 14px !important; 
      width: auto !important;
    }
  </style>
  
  <div class="my-custom-icons" style="margin-bottom: 1rem; display: flex; gap: 10px; align-items: center; justify-content: center;">
    {{ partial "badge-links.html" . }}
  </div>

  <div class="footer">
    {{- if .Site.Params.author -}}
      <a class="footer-author" href="{{ .Site.BaseURL }}">{{ .Site.Params.author }}</a> © {{ now.Format "2006" }}
    {{- end -}}
  </div>
</footer>
