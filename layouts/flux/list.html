<style>
  /* ===== Flux Page Styles ===== */
  .flux-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 1rem;
  }
  .flux-header h1 {
    margin: 0;
    font-size: 1.5em;
  }
  .flux-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .flux-search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .flux-search {
    padding: 6px 28px 6px 12px;
    border: 1px solid #ddd;
    border-radius: 20px;
    font-size: 0.85em;
    outline: none;
    width: 200px;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: transparent;
    color: var(--text-color);
  }
  .flux-search:focus {
    border-color: #999;
    box-shadow: 0 0 0 2px rgba(150,150,150,0.15);
  }
  .flux-search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    color: var(--text-color);
    opacity: 0.4;
    padding: 2px 4px;
    display: none;
  }
  .flux-search-clear:hover {
    opacity: 0.8;
  }
  .flux-export-btn {
    padding: 6px 14px;
    border: 1px solid #ddd;
    border-radius: 20px;
    font-size: 0.8em;
    cursor: pointer;
    background: transparent;
    color: var(--text-color);
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
    text-decoration: none !important;
  }
  .flux-export-btn:hover {
    background: rgba(150,150,150,0.1);
    border-color: #bbb;
    text-decoration: none !important;
  }
  .flux-stats {
    font-size: 0.8em;
    opacity: 0.5;
    font-style: italic;
    margin-top: 4px;
  }

  /* Globe container */
  .flux-globe-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    position: relative;
    /* Removed overflow: hidden so the sides aren't cropped! */
    cursor: grab;
    user-select: none;
  }
  .flux-globe-wrap:active {
    cursor: grabbing;
  }
  .flux-globe {
    position: relative;
    transform-style: preserve-3d;
  }

  /* Capsule on globe */
  .flux-tag {
    position: absolute;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px 3px 5px;
    border-radius: 16px;
    font-size: 8px;
    text-decoration: none !important;
    color: #fff !important;
    cursor: pointer;
    line-height: 1.3;
    white-space: nowrap;
    transform-origin: center center;
    transition: opacity 0.4s ease, filter 0.4s ease;
    will-change: transform, opacity;
    backface-visibility: hidden;
  }
  .flux-tag:hover {
    text-decoration: none !important;
  }
  .flux-tag img {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.25);
  }
  .flux-tag .flux-name {
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .flux-tag mark {
    background: rgba(255,255,200,0.5);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }
  .flux-tag.flux-dimmed {
    opacity: 0.04 !important;
    pointer-events: none;
  }

  /* No results overlay */
  .flux-no-results {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.9em;
    opacity: 0;
    font-style: italic;
    color: var(--text-color);
    pointer-events: none;
    transition: opacity 0.6s ease;
    text-align: center;
    z-index: 10;
  }
  .flux-no-results.flux-show {
    opacity: 0.6;
  }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    .flux-search { border-color: #555; }
    .flux-search:focus { border-color: #888; box-shadow: 0 0 0 2px rgba(200,200,200,0.1); }
    .flux-export-btn { border-color: #555; }
    .flux-export-btn:hover { background: rgba(200,200,200,0.08); border-color: #777; }
    .flux-tag { color: #f0f0f0 !important; }
    .flux-tag mark { background: rgba(255,255,200,0.3); }
  }

  @media (max-width: 600px) {
    .flux-header { flex-direction: column; align-items: flex-start; }
    .flux-search-wrap { width: 100%; }
    .flux-search { width: 100%; }
  }
</style>

<div class="flux-header">
  <div class="flux-title-group">
    <h1>Flux</h1>
    <div class="flux-stats" id="flux-stats"></div>
  </div>
  <div class="flux-actions">
    <div class="flux-search-wrap">
      <input type="text" class="flux-search" id="flux-search" placeholder="Search feeds..." autocomplete="off" />
      <button class="flux-search-clear" id="flux-search-clear" type="button">✕</button>
    </div>
    <button class="flux-export-btn" onclick="exportOPML()">Export as OPML</button>
  </div>
</div>
<div class="flux-globe-wrap" id="flux-globe-wrap">

</div>

      { name: "Sindre Sorhus", url: "https://sindresorhus.com", rss: "https://sindresorhus.com/rss.xml" },
      { name: "AI HOT 日报", url: "https://aihot.virxact.com/daily", rss: "https://aihot.virxact.com/feed/daily.xml" },
      { name: "Kar's Blog", url: "https://thekarchan.github.io/thewindboy/", rss: "https://thekarchan.github.io/thewindboy/latest/index.xml" },
      { name: "61's life", url: "https://61.life/", rss: "https://61.life/feed.xml/feed" }
    ]
  }
];

// ===== Flatten all feeds =====
const allFeeds = [];
fluxData.forEach(g => g.feeds.forEach(f => allFeeds.push(f)));
const totalFeeds = allFeeds.length;

// ===== Color Palette =====
const colorsLight = [
  '#6b7280','#7c6f64','#7e6e85','#5f7a8a','#6d7e5f',
  '#8b6f5c','#6a7d8b','#7b6b8a','#5c7d6d','#8a6b6b',
  '#6e7b6b','#7a6d7b','#5d7a7a','#7b7060','#6b6f80',
  '#85706a','#607a6b','#7a6570','#6b7a5d','#706b80',
  '#8b7565','#5e7580','#7b6a65','#657a75','#806b75',
  '#6a7570','#757060','#6b6a7a','#807565','#657070'
];
const colorsDark = [
  '#8b9bb5','#a89984','#b39dbd','#7eaabb','#95b07e',
  '#c09880','#8da8b8','#a88db8','#80b09a','#b88d8d',
  '#92a890','#a890a8','#80aaa5','#a89870','#8090a5',
  '#b8908a','#80a590','#a88598','#90a880','#9088a5',
  '#b89a82','#7e98a8','#a89085','#85a898','#a888a0',
  '#8a9890','#989070','#8888a5','#a89882','#8a9898'
];

function isDark() { return window.matchMedia('(prefers-color-scheme: dark)').matches; }
function hashStr(s) { let h=0; for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;} return Math.abs(h); }
function getColor(name) { const p=isDark()?colorsDark:colorsLight; return p[hashStr(name)%p.length]; }
function getFavicon(url) { try{return `https://www.google.com/s2/favicons?sz=32&domain=${new URL(url).hostname}`;}catch{return '';} }

// ===== Globe Engine =====
const globe = document.getElementById('flux-globe');
const wrap = document.getElementById('flux-globe-wrap');
const noResultsEl = document.getElementById('flux-no-results');
const statsEl = document.getElementById('flux-stats');

// Sphere sizing based on actual container to prevent parent clipping
const containerW = wrap.clientWidth || Math.min(800, document.documentElement.clientWidth);

// Force globe to stay inside the container bounds
const SIZE_X = containerW;
// Reserve 80px on left/right so the wide text tags don't overflow the container
const RADIUS_X = Math.max(120, (SIZE_X / 2) - 80);
// Keep it slightly oblate
const RADIUS_Y = RADIUS_X * 0.9; 
// Add 120px padding (60 top, 60 bottom) to prevent top/bottom tags from being cut off or overlapped
const SIZE_Y = RADIUS_Y * 2 + 120;

wrap.style.height = SIZE_Y + 'px';
globe.style.width = SIZE_X + 'px';
globe.style.height = SIZE_Y + 'px';

// Distribute points on sphere using Fibonacci spiral
const points = [];
const N = totalFeeds;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) {
  // t goes linearly from 1 to -1
  const t = 1 - (i / (N - 1)) * 2; 
  // Use a non-linear mapping (t^2 with sign) to make poles sparser and equator denser
  // This keeps the full sphere shape but avoids the extreme text overlap at poles
  const y = t * Math.abs(t); 
  const radiusAtY = Math.sqrt(1 - y * y);
  const theta = goldenAngle * i;
  points.push({
    x: Math.cos(theta) * radiusAtY,
    y: y,
    z: Math.sin(theta) * radiusAtY
  });
}

// Create DOM elements
const tagEls = [];
let isHovering = false;

allFeeds.forEach((feed, i) => {
  const a = document.createElement('a');
  a.className = 'flux-tag';
  a.href = feed.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.style.background = getColor(feed.name);
  a.style.left = '0px';
  a.style.top = '0px';
  a.style.transformOrigin = '0 0';
  a.dataset.index = i;
  
  a.addEventListener('mouseenter', () => { isHovering = true; });
  a.addEventListener('mouseleave', () => { isHovering = false; });
  
  const fav = getFavicon(feed.url);
  a.innerHTML = `<img src="${fav}" alt="" loading="lazy" onerror="this.style.display='none'" /><span class="flux-name">${feed.name}</span>`;
  globe.appendChild(a);
  tagEls.push({
    el: a,
    origPoint: { ...points[i] },
    matched: true,
    feed: feed,
    halfW: 0,
    halfH: 0
  });
});

// After DOM rendering, get dimensions
requestAnimationFrame(() => {
  tagEls.forEach(item => {
    item.halfW = item.el.offsetWidth / 2;
    item.halfH = item.el.offsetHeight / 2;
  });
});

// Rotation state
let angleX = -0.2;
let angleY = 0;
let speedY = 0.002;  // auto-rotate speed
let dragging = false;
let isSearching = false;
let lastMx = 0, lastMy = 0;
let spinMode = false; // fast spin for no-results
let spinSpeed = 0;
let spinDecel = 0;

// 3D rotation matrix multiply
function rotatePoint(px, py, pz) {
  const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
  const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
  
  // Rotate around X axis
  let y1 = py * cosX - pz * sinX;
  let z1 = py * sinX + pz * cosX;
  let x1 = px;

  // Rotate around Y axis
  let x2 = x1 * cosY + z1 * sinY;
  let z2 = -x1 * sinY + z1 * cosY;
  let y2 = y1;

  return { x: x2, y: y2, z: z2 };
}

function render() {
  const cx = SIZE_X / 2;
  const cy = SIZE_Y / 2;
  const perspective = RADIUS_X * 2.5; // Smooth perspective based on width

  tagEls.forEach((item) => {
    const p = item.origPoint;
    const r = rotatePoint(p.x, p.y, p.z);
    
    // Z in 3D space. Positive is towards camera.
    const z3d = r.z * RADIUS_X;
    const scale3d = perspective / (perspective - z3d);
    
    const x2d = r.x * RADIUS_X * scale3d;
    const y2d = r.y * RADIUS_Y * scale3d;

    // depthNorm from 0 (back) to 1 (front)
    const depthNorm = (r.z + 1) / 2; 

    const opacity = item.matched ? (0.15 + depthNorm * 0.85) : 0.02;
    const blur = depthNorm > 0.4 ? 0 : (1 - depthNorm) * 2.5;

    // Center the element using its precalculated width/height
    const x_final = cx + x2d - item.halfW * scale3d;
    const y_final = cy + y2d - item.halfH * scale3d;

    item.el.style.transform = `translate3d(${x_final}px, ${y_final}px, 0) scale(${scale3d})`;
    item.el.style.zIndex = Math.round(depthNorm * 1000);
    item.el.style.opacity = opacity;
    item.el.style.filter = blur > 0 ? `blur(${blur}px)` : 'none';
    item.el.style.pointerEvents = (depthNorm > 0.3 && item.matched) ? 'auto' : 'none';
  });
}

function animate() {
  if (!dragging && !isHovering) {
    if (spinMode) {
      angleY -= spinSpeed;
      spinSpeed *= (1 - spinDecel);
      if (Math.abs(spinSpeed) < 0.002) {
        spinMode = false;
        speedY = 0.002;
      }
    } else if (!isSearching) {
      angleY -= speedY;
    }
  }
  render();
  requestAnimationFrame(animate);
}

// ===== Mouse / Touch Drag =====
wrap.addEventListener('mousedown', e => {
  dragging = true;
  lastMx = e.clientX;
  lastMy = e.clientY;
  spinMode = false;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastMx;
  const dy = e.clientY - lastMy;
  angleY += dx * 0.005;
  angleX -= dy * 0.005; // Drag down -> angleX decreases -> sphere rotates down
  angleX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, angleX));
  lastMx = e.clientX;
  lastMy = e.clientY;
});
window.addEventListener('mouseup', () => { dragging = false; });
wrap.addEventListener('mouseleave', () => { dragging = false; });

wrap.addEventListener('touchstart', e => {
  dragging = true;
  lastMx = e.touches[0].clientX;
  lastMy = e.touches[0].clientY;
  spinMode = false;
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (!dragging) return;
  const dx = e.touches[0].clientX - lastMx;
  const dy = e.touches[0].clientY - lastMy;
  angleY += dx * 0.005;
  angleX -= dy * 0.005;
  angleX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, angleX));
  lastMx = e.touches[0].clientX;
  lastMy = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchend', () => { dragging = false; });

// ===== Search =====
const searchInput = document.getElementById('flux-search');
const clearBtn = document.getElementById('flux-search-clear');

function doSearch(query) {
  const q = (query || '').trim().toLowerCase();
  isSearching = q.length > 0;
  let matchedCount = 0;
  let firstMatchIndex = -1;

  tagEls.forEach((item, i) => {
    const name = item.feed.name.toLowerCase();
    const url = item.feed.url.toLowerCase();
    const matched = !q || name.includes(q) || url.includes(q);
    item.matched = matched;
    if (matched) {
      matchedCount++;
      if (firstMatchIndex < 0) firstMatchIndex = i;
    }
    if (q && matched) {
      const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      item.el.querySelector('.flux-name').innerHTML = item.feed.name.replace(regex, '<mark>$1</mark>');
      item.el.classList.remove('flux-dimmed');
    } else if (q && !matched) {
      item.el.querySelector('.flux-name').textContent = item.feed.name;
      item.el.classList.add('flux-dimmed');
    } else {
      item.el.querySelector('.flux-name').textContent = item.feed.name;
      item.el.classList.remove('flux-dimmed');
    }
  });

  statsEl.textContent = q
    ? `Found ${matchedCount} of ${totalFeeds} feeds`
    : `${totalFeeds} feeds in total`;

  if (q && matchedCount === 0) {
    noResultsEl.classList.remove('flux-show');
    spinMode = true;
    spinSpeed = 0.15;
    spinDecel = 0.008;
    setTimeout(() => { noResultsEl.classList.add('flux-show'); }, 800);
  } else {
    noResultsEl.classList.remove('flux-show');
    if (q && firstMatchIndex >= 0) {
      const p = tagEls[firstMatchIndex].origPoint;
      
      // Calculate target angles to bring this point to front (z=1)
      const targetAngleX = Math.atan2(p.y, p.z);
      const z1 = p.y * Math.sin(targetAngleX) + p.z * Math.cos(targetAngleX);
      const targetAngleY = Math.atan2(-p.x, z1);
      
      spinMode = false;
      const startY = angleY, startX = angleX;
      
      let dy = targetAngleY - (startY % (2 * Math.PI));
      if (dy > Math.PI) dy -= 2 * Math.PI;
      if (dy < -Math.PI) dy += 2 * Math.PI;
      const dx = targetAngleX - startX;
      
      const duration = 600;
      const t0 = performance.now();
      function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
      function animateTo(now) {
        const elapsed = now - t0;
        const progress = Math.min(elapsed / duration, 1);
        const e = ease(progress);
        angleY = startY + dy * e;
        angleX = startX + dx * e;
        if (progress < 1 && dragging === false) requestAnimationFrame(animateTo);
      }
      requestAnimationFrame(animateTo);
    }
  }
}

let searchTimeout;
searchInput.addEventListener('input', function() {
  clearTimeout(searchTimeout);
  clearBtn.style.display = this.value ? 'block' : 'none';
  searchTimeout = setTimeout(() => doSearch(this.value), 200);
});
clearBtn.addEventListener('click', function() {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  doSearch('');
  searchInput.focus();
});

// Dark mode re-color
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  tagEls.forEach(item => { item.el.style.background = getColor(item.feed.name); });
});

// ===== OPML Export =====
function exportOPML() {
  let opml = '<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n<head>\n<title>Kar\'s RSS Subscriptions</title>\n</head>\n<body>\n';
  fluxData.forEach(group => {
    opml += `<outline text="${esc(group.category)}" title="${esc(group.category)}">\n`;
    group.feeds.forEach(feed => {
      opml += `  <outline type="rss" text="${esc(feed.name)}" title="${esc(feed.name)}" xmlUrl="${esc(feed.rss)}" htmlUrl="${esc(feed.url)}" />\n`;
    });
    opml += '</outline>\n';
  });
  opml += '</body>\n</opml>';
  const blob = new Blob([opml], { type: 'text/xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kar-rss-subscriptions.opml';
  a.click();
  URL.revokeObjectURL(a.href);
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }

// ===== Init =====
statsEl.textContent = `${totalFeeds} feeds in total`;
animate();
</script>
