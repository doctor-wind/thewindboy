<footer style="padding-top: 1rem;">
  <hr>
  
  <style>
    .my-custom-icons svg, .my-custom-icons img {
      height: 14px !important; 
      width: auto !important;
    }
  </style>
  
  <div class="my-custom-icons" style="margin-bottom: 0.5rem; display: flex; gap: 15px; align-items: center; justify-content: center;">
    <a href="https://x.com/kar_found" target="_blank" rel="noopener">X.com</a>
    <a href="https://c7.io/@kar" target="_blank" rel="me noopener">Mastodon</a>
    <a href="https://broadcast-17n.pages.dev" target="_blank" rel="noopener">Telegram Post</a>
    <a href="{{ "index.xml" | relURL }}" target="_blank">RSS</a>
  </div>

  <div class="my-custom-icons" style="margin-bottom: 1rem; display: flex; gap: 10px; align-items: center; justify-content: center;">
    {{ partial "badge-links.html" . }}
  </div>

  <div class="footer">
    {{- if .Site.Params.author -}}
      <a class="footer-author" href="{{ .Site.BaseURL }}">{{ .Site.Params.author }}</a> © {{ now.Format "2006" }}
    {{- end -}}
  </div>
</footer>
