<style>
  /* ===== Flux Page Styles ===== */
  .flux-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .flux-header h1 {
    margin: 0;
    font-size: 1.5em;
  }
  .flux-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .flux-search {
    padding: 6px 12px;
    border: 1px solid #ddd;
    border-radius: 20px;
    font-size: 0.85em;
    outline: none;
    width: 200px;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: transparent;
    color: var(--text-color);
  }
  .flux-search:focus {
    border-color: #999;
    box-shadow: 0 0 0 2px rgba(150,150,150,0.15);
  }
  .flux-export-btn {
    padding: 6px 14px;
    border: 1px solid #ddd;
    border-radius: 20px;
    font-size: 0.8em;
    cursor: pointer;
    background: transparent;
    color: var(--text-color);
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
    text-decoration: none !important;
  }
  .flux-export-btn:hover {
    background: rgba(150,150,150,0.1);
    border-color: #bbb;
    text-decoration: none !important;
  }
  .flux-stats {
    font-size: 0.8em;
    opacity: 0.5;
    margin-bottom: 1.5rem;
    font-style: italic;
  }

  /* Blob container — organic rounded shape */
  .flux-blob {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    padding: 2rem 1.5rem;
    border-radius: 48% 52% 55% 45% / 50% 45% 55% 50%;
    background: rgba(150, 150, 150, 0.04);
    border: 1px dashed rgba(150,150,150,0.2);
    max-width: 100%;
  }

  /* Capsule styles — light mode */
  .flux-capsule {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px 5px 10px;
    border-radius: 20px;
    font-size: 0.82em;
    text-decoration: none !important;
    color: #fff !important;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
    cursor: pointer;
    line-height: 1.4;
    white-space: nowrap;
  }
  .flux-capsule:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    text-decoration: none !important;
  }
  .flux-capsule img {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.3);
  }
  .flux-capsule .flux-name {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .flux-capsule.flux-dimmed {
    opacity: 0.12;
  }
  .flux-capsule mark {
    background: rgba(255,255,200,0.45);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }
  .flux-no-results {
    font-size: 0.85em;
    opacity: 0.5;
    font-style: italic;
    padding: 2rem 0;
    text-align: center;
    display: none;
  }

  /* Dark mode adaptations */
  @media (prefers-color-scheme: dark) {
    .flux-search {
      border-color: #555;
    }
    .flux-search:focus {
      border-color: #888;
      box-shadow: 0 0 0 2px rgba(200,200,200,0.1);
    }
    .flux-export-btn {
      border-color: #555;
    }
    .flux-export-btn:hover {
      background: rgba(200,200,200,0.08);
      border-color: #777;
    }
    .flux-blob {
      background: rgba(200, 200, 200, 0.04);
      border-color: rgba(200,200,200,0.12);
    }
    .flux-capsule {
      color: #f0f0f0 !important;
    }
    .flux-capsule:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }
    .flux-capsule mark {
      background: rgba(255,255,200,0.3);
    }
  }

  @media (max-width: 600px) {
    .flux-header {
      flex-direction: column;
      align-items: flex-start;
    }
    .flux-search {
      width: 100%;
    }
    .flux-blob {
      padding: 1.5rem 1rem;
      border-radius: 40% 60% 50% 50% / 55% 45% 55% 45%;
    }
  }
</style>

// ===== Color Palette — muted, readable tones for both light & dark =====
const capsuleColorsLight = [
  '#6b7280', '#7c6f64', '#7e6e85', '#5f7a8a', '#6d7e5f',
  '#8b6f5c', '#6a7d8b', '#7b6b8a', '#5c7d6d', '#8a6b6b',
  '#6e7b6b', '#7a6d7b', '#5d7a7a', '#7b7060', '#6b6f80',
  '#85706a', '#607a6b', '#7a6570', '#6b7a5d', '#706b80',
  '#8b7565', '#5e7580', '#7b6a65', '#657a75', '#806b75',
  '#6a7570', '#757060', '#6b6a7a', '#807565', '#657070'
];

const capsuleColorsDark = [
  '#8b9bb5', '#a89984', '#b39dbd', '#7eaabb', '#95b07e',
  '#c09880', '#8da8b8', '#a88db8', '#80b09a', '#b88d8d',
  '#92a890', '#a890a8', '#80aaa5', '#a89870', '#8090a5',
  '#b8908a', '#80a590', '#a88598', '#90a880', '#9088a5',
  '#b89a82', '#7e98a8', '#a89085', '#85a898', '#a888a0',
  '#8a9890', '#989070', '#8888a5', '#a89882', '#8a9898'
];

// Detect dark mode
function isDarkMode() {
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

// Seeded random based on string hash for stable colors
function hashStr(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function getCapsuleColor(name) {
  const palette = isDarkMode() ? capsuleColorsDark : capsuleColorsLight;
  return palette[hashStr(name) % palette.length];
}

function getFavicon(url) {
  try {
    const domain = new URL(url).hostname;
    return `https://www.google.com/s2/favicons?sz=32&domain=${domain}`;
  } catch {
    return '';
  }
}

// ===== Render =====
function renderFlux(query) {
  const container = document.getElementById('flux-container');
  const noResults = document.getElementById('flux-no-results');
  const statsEl = document.getElementById('flux-stats');
  const q = (query || '').trim().toLowerCase();
  let totalFeeds = 0;
  let matchedFeeds = 0;
  let allCapsules = '';

  fluxData.forEach(group => {
    totalFeeds += group.feeds.length;
    group.feeds.forEach(feed => {
      const matched = !q || feed.name.toLowerCase().includes(q) || feed.url.toLowerCase().includes(q);
      if (matched) matchedFeeds++;
      const dimClass = q && !matched ? ' flux-dimmed' : '';
      const color = getCapsuleColor(feed.name);
      const favicon = getFavicon(feed.url);
      let displayName = feed.name;
      if (q && matched) {
        const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        displayName = displayName.replace(regex, '<mark>$1</mark>');
      }
      allCapsules += `<a class="flux-capsule${dimClass}" href="${feed.url}" target="_blank" rel="noopener" style="background:${color};" data-rss="${encodeURIComponent(feed.rss)}" data-name="${feed.name}" data-url="${feed.url}">` +
        `<img src="${favicon}" alt="" loading="lazy" onerror="this.style.display='none'" />` +
        `<span class="flux-name">${displayName}</span></a>`;
    });
  });

  container.innerHTML = `<div class="flux-blob">${allCapsules}</div>`;
  statsEl.textContent = q
    ? `Found ${matchedFeeds} of ${totalFeeds} feeds`
    : `${totalFeeds} feeds in total`;
  noResults.style.display = (q && matchedFeeds === 0) ? 'block' : 'none';
}

// ===== Search =====
const searchInput = document.getElementById('flux-search');
let searchTimeout;
searchInput.addEventListener('input', function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => renderFlux(this.value), 150);
});

// Re-render on color scheme change for proper dark mode colors
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  renderFlux(searchInput.value);
});

// ===== OPML Export =====
function exportOPML() {
  let opml = '<?xml version="1.0" encoding="UTF-8"?>\n';
  opml += '<opml version="2.0">\n<head>\n<title>Kar\'s RSS Subscriptions</title>\n</head>\n<body>\n';

  fluxData.forEach(group => {
    opml += `<outline text="${escXml(group.category)}" title="${escXml(group.category)}">\n`;
    group.feeds.forEach(feed => {
      opml += `  <outline type="rss" text="${escXml(feed.name)}" title="${escXml(feed.name)}" xmlUrl="${escXml(feed.rss)}" htmlUrl="${escXml(feed.url)}" />\n`;
    });
    opml += '</outline>\n';
  });

  opml += '</body>\n</opml>';

  const blob = new Blob([opml], { type: 'text/xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kar-rss-subscriptions.opml';
  a.click();
  URL.revokeObjectURL(a.href);
}

function escXml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

// Initial render
renderFlux('');
</script>
{{ end }}
