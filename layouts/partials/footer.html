<footer style="padding-top: 1rem; margin-top: 2rem;">


  <hr style="margin-bottom: 1.2rem; border: 0; border-top: 1px dashed #ccc;">
  
  <style>
    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .footer-item {
      display: flex;
      align-items: center;
    }
    .footer-social-links {
      font-size: 0.85em; 
      font-style: italic; 
      opacity: 0.85; 
      display: flex; 
      align-items: center; 
      gap: 10px;
      margin: 0;
      white-space: nowrap;
    }
    .footer-center {
      font-size: 0.85em;
      justify-content: center;
      white-space: nowrap;
    }
    .footer-right {
      font-size: 0.85em;
      opacity: 0.8;
      justify-content: flex-end;
      white-space: nowrap;
    }
    .footer-social-links a {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .footer-social-links svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }
    .social-sep {
      opacity: 0.5;
    }
    @media (max-width: 800px) {
      .footer-item {
        flex: none;
        width: 100%;
        justify-content: center;
      }
      .footer-social-links {
        justify-content: center;
      }
    }
  </style>

  <div class="footer-content">
    <div class="footer-item footer-social-links">
      <a href="https://x.com/kar_found" target="_blank" rel="noopener">

        X.com
      </a>
      <span class="social-sep">/</span>

    </div>

    <div class="footer-item footer-center">
      <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh-hans" style="display: inline-flex; align-items: center; gap: 4px; opacity: 0.8; color: inherit; text-decoration: none;"><img src="https://mirrors.creativecommons.org/presskit/buttons/88x31/svg/by-nc-nd.svg" style="height: 11px; width: auto;" alt="CC BY-NC-ND"><span>承诺非AI创作</span></a>{{ if and .IsPage (eq .Type "blog") }}<span style="opacity: 0.8;"> · {{ .WordCount }} 字</span>{{ end }}
    </div>

    <div class="footer-item footer-right">
      {{- if .Site.Params.author -}}
        <a class="footer-author" href="{{ .Site.BaseURL }}" style="color: inherit; text-decoration: none;">{{ .Site.Params.author }}</a> © {{ now.Format "2006" }}
      {{- end -}}

  </div>
</footer>
